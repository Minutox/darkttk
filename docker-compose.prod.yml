services:
  postgres:
    ports: []
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

  redis:
    ports: []
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

  api:
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid
    environment:
      APP_ENV: production
      AUTO_CREATE_SCHEMA: "false"
      READINESS_REQUIRE_REDIS: "true"
      RELEASE_VERSION: ${RELEASE_VERSION:?RELEASE_VERSION is required}
      ACCOUNT_DELIVERY_MODE: ${ACCOUNT_DELIVERY_MODE:-disabled}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ACCOUNT_EMAIL_FROM: ${ACCOUNT_EMAIL_FROM:-}
      PASSWORD_RECOVERY_URL: ${PASSWORD_RECOVERY_URL:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G

  render-worker:
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2.00"
          memory: 2G

  publish-worker:
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.00"
          memory: 768M

  analytics-worker:
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
