name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          cache: npm
      - run: npm ci
      - run: npm run release:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements.txt
      - run: pip install -r services/api/requirements.txt
      - run: pytest services/api/tests
        env:
          AUTH_RATE_LIMIT_PER_MINUTE: "120"
          PYTHONPATH: services/api
      - run: python -m compileall -q services/api/darkttk

  containers:
    runs-on: ubuntu-latest
    needs: [frontend, api]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: docker build --pull --tag darkttk-api:${{ github.sha }} services/api
      - name: Validate production Compose configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
        env:
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          RELEASE_VERSION: ci
